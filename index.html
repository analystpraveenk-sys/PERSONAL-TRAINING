function getExerciseHistory(exerciseName){
  const out = [];
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.startsWith("exlog:")){
      const date = key.slice(6);
      try {
        const data = JSON.parse(localStorage.getItem(key));
        const rec = data[exerciseName];
        if(rec && rec.sets && rec.sets.length){
          const bestWeight = Math.max(...rec.sets.map(s=>s.weight||0));
          out.push({ date, weight: bestWeight, sets: rec.sets });
        }
      } catch(e){}
    }
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

  todaysWorkout.exercises.forEach(ex=>{

      const targetSets = parseSets(ex[weekKey]);
      const detail = exLog[ex.name];
      if(detail && detail.sets && detail.sets.length){
        totalSets += detail.sets.length;
        detail.sets.forEach(s=>{ tonnage += (s.weight||0) * (s.reps||0); });
      } else {
        totalSets += targetSets; // not logged yet, estimate from planned sets
      }
    }
  });
  const bw = getLatestBodyweight();
  const minutes = totalSets * 3; // ~3 min per set incl. rest, rough estimate
  const MET = 6.0; // vigorous resistance training
  const calories = Math.round(MET * 3.5 * bw / 200 * minutes);
  return { totalSets, tonnage: Math.round(tonnage), calories };
}

  const maxWeight = Math.max(...hist.map(h=>h.weight||0));
  return weight > maxWeight;

// Strength standards: 1RM-to-bodyweight ratio thresholds (male), consensus of
// ExRx / StrengthLevel / NSCA-style benchmarks. Levels: Beginner, Novice, Intermediate, Advanced, Elite.
const LEVELS = ["Beginner","Novice","Intermediate","Advanced","Elite"];
const LIFT_STANDARDS = {
  "Barbell Bench Press": [0.5, 0.75, 1.0, 1.5, 2.0],
  "Back Squat": [0.75, 1.0, 1.5, 2.0, 2.5],
  "Deadlift": [1.0, 1.5, 2.0, 2.5, 3.0],
};
function estimate1RM(weight, reps){
  return weight * (1 + reps/30); // Epley formula
}
function bestEstimated1RM(exerciseName){
  const hist = getExerciseHistory(exerciseName);
  let best = 0;
  hist.forEach(h=>{
    h.sets.forEach(s=>{
      const e = estimate1RM(s.weight||0, s.reps||1);
      if(e > best) best = e;
    });
  });
  return Math.round(best);
}
function strengthLevelFor(ratio, thresholds){
  let idx = -1;
  for(let i=0;i<thresholds.length;i++){ if(ratio >= thresholds[i]) idx = i; }
  return idx >= 0 ? LEVELS[idx] : "Untrained";
}
function nextThreshold(ratio, thresholds){
  for(let i=0;i<thresholds.length;i++){ if(ratio < thresholds[i]) return {level:LEVELS[i], ratio:thresholds[i]}; }
  return null; // already Elite
}

}

function weeklySummary(){
  let totalVolume=0, sleepSum=0, sleepDays=0, habitsSum=0, habitsDaysCounted=0, daysActive=0;
  const habitList = loadHabitList();
  for(let i=0;i<7;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const dow = d.getDay();
    try {
      const raw = localStorage.getItem("log:"+iso);
      if(raw){
        const data = JSON.parse(raw);
        if(data.workout && Object.values(data.workout).some(v=>v)) daysActive++;
        if(data.habits && habitList.length>0){
          habitsSum += Object.values(data.habits).filter(Boolean).length / habitList.length;
          habitsDaysCounted++;
        }
      }
      const exraw = localStorage.getItem("exlog:"+iso);
      if(exraw){
        const exd = JSON.parse(exraw);
        Object.values(exd).forEach(rec=>{ if(rec.sets) rec.sets.forEach(s=>{ totalVolume += (s.weight||0)*(s.reps||0); }); });
      }
      const sHist = sleepHistory.find(s=>s.date===iso);
      if(sHist){ sleepSum += sHist.hours; sleepDays++; }
    } catch(e){}
  }
  return {
    totalVolume: Math.round(totalVolume),
    avgSleep: sleepDays>0 ? (sleepSum/sleepDays).toFixed(1) : null,
    avgHabitPct: habitsDaysCounted>0 ? Math.round((habitsSum/habitsDaysCounted)*100) : null,
    daysActive,
  };
}

function deloadDue(){
  const w = weeksSinceStart();
  return w>0 && w % 7 === 0;
}
function allDataSummary(){
  let workoutDays=0, totalSets=0, mealsLoggedDays=0;
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.startsWith("log:")){
      try {
        const d = JSON.parse(localStorage.getItem(key));
        if(d.workout && Object.values(d.workout).some(v=>v)) workoutDays++;
        if(d.meals && Object.values(d.meals).some(v=>v)) mealsLoggedDays++;
      } catch(e){}
    }
    if(key && key.startsWith("exlog:")){
      try {
        const d = JSON.parse(localStorage.getItem(key));
        Object.values(d).forEach(rec=>{ if(rec.sets) totalSets += rec.sets.length; });
      } catch(e){}
    }
  }
  return {
    workoutDays, totalSets, mealsLoggedDays,
    weightEntries: weightHistory.length,
    sleepEntries: sleepHistory.length,
    measureEntries: measureHistory.length,
    photoEntries: photoHistory.length,
    habitCount: loadHabitList().length,
    injuryEntries: injuryLog.length,
  };
}
function exportAllData(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    try { data[key] = JSON.parse(localStorage.getItem(key)); }
    catch(e){ data[key] = localStorage.getItem(key); }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "chayil-data-backup-"+DATE+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function prHistoryList(){
  return allExerciseNames().map(name=>{
    const hist = getExerciseHistory(name);
    if(hist.length===0) return null;
    let best = 0, bestDate = "";
    hist.forEach(h=>{ if(h.weight>best){ best=h.weight; bestDate=h.date; } });
    return {name, best, date:bestDate};
  }).filter(Boolean).sort((a,b)=>b.best-a.best);
}

    { icon:"🏋️", name:"First Set", desc:"Log your very first set", done: totalSets >= 1 },

function ring(label, value, target, color, unit){
  const pct = target ? Math.min(value/target, 1) : 0;
  const r = 34, circ = 2*Math.PI*r, off = circ*(1-pct);
  return `<div class="ring-wrap">
    <div class="ring-svg">
      <svg viewBox="0 0 80 80" width="80" height="80" style="transform:rotate(-90deg)">
        <circle cx="40" cy="40" r="${r}" fill="none" stroke="#212D3D" stroke-width="8"/>
        <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
          class="${animateNext ? 'ring-anim' : ''}" style="--circ:${circ.toFixed(1)};--off:${off.toFixed(1)};filter:drop-shadow(0 0 4px ${color}99)"/>
      </svg>
      <div class="ring-center"><span class="ring-val">${value}</span><span class="ring-target">/${target}${unit}</span></div>
    </div>
    <span class="ring-label" style="color:${color}">${label}</span>
  </div>`;
}

function dailyScore(){
  const comps = [];
  const mealsDone = todaysMeals.meals.filter(m=>log.meals[m.slot]).length;
  comps.push({ label:"Meals", color:"#FF8A3D", pct: mealsDone/todaysMeals.meals.length });
  if(todaysWorkout.exercises.length>0){
    const done = todaysWorkout.exercises.filter(e=>log.workout[e.name]).length;
    comps.push({ label:"Workout", color:"#F472B6", pct: done/todaysWorkout.exercises.length });
  }
  const hl = loadHabitList();
  if(hl.length) comps.push({ label:"Habits", color:"#4ADE80", pct: hl.filter(h=>log.habits[h]).length/hl.length });
  const sl = loadSupplementList();
  if(sl.length) comps.push({ label:"Supps", color:"#A78BFA", pct: sl.filter(x=>log.supplements[x]).length/sl.length });
  const total = comps.reduce((a,c)=>a+c.pct,0)/comps.length;
  return { comps, pct: Math.round(total*100) };
}

function showToast(msg){
  let t = document.getElementById("celebrateToast");
  if(!t){ t = document.createElement("div"); t.id = "celebrateToast"; t.className = "celebrate-toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2800);
}
function confettiBurst(){
  const now = Date.now();
  if(now - lastConfetti < 1800) return;
  lastConfetti = now;
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3000;";
  const W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const colors = ["#FF8A3D","#4ADE80","#38BDF8","#F472B6","#A78BFA","#FFD166","#C2703D"];
  const parts = Array.from({length:140}, ()=>({
    x: W/2 + (Math.random()-.5)*W*0.3, y: H*0.35,
    vx: (Math.random()-.5)*12, vy: -(Math.random()*11+4),
    g: 0.28 + Math.random()*0.12, s: 5 + Math.random()*6,
    r: Math.random()*6.28, vr: (Math.random()-.5)*.4,
    c: colors[(Math.random()*colors.length)|0]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= 0.99;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - frames/110);
      ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*0.6); ctx.restore();
    });
    frames++;
    if(frames < 115) requestAnimationFrame(tick); else cv.remove();
  })();
}
function celebrate(msg){
  showToast(msg);
  if(navigator.vibrate) navigator.vibrate([70,40,70,40,120]);
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  confettiBurst();
}

function svgLineChart(points, color, unit){
  if(points.length < 2){
    return `<div class="small-note">Log at least 2 entries to see a trend chart.</div>`;
  }
  const w = 320, h = 140, pad = 28;
  const vals = points.map(p=>p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min===max){ min -= 1; max += 1; }
  const xStep = (w - pad*2) / (points.length - 1);
  const coords = points.map((p,i)=>{
    const x = pad + i*xStep;
    const y = h - pad - ((p.value - min)/(max-min)) * (h - pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?"M":"L") + c[0].toFixed(1) + "," + c[1].toFixed(1)).join(" ");
  const dots = coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="${color}"><title>${points[i].date}: ${points[i].value}${unit}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <text x="${pad}" y="14" font-size="10" fill="#8B96A3" font-family="JetBrains Mono, monospace">${max}${unit}</text>
    <text x="${pad}" y="${h-pad+16}" font-size="10" fill="#8B96A3" font-family="JetBrains Mono, monospace">${min}${unit}</text>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}
  </svg>`;
}

  const hStats = habitHistoryStats(30);
  html += `<div class="progress-card">
    <div class="progress-label">✅ Habit History <span style="color:#4A8FC2;">${getHabitStreak()}🔥 streak</span></div>`;
  if(hStats.list.length===0){
    html += `<div class="small-note">No habits set up yet — add some on the Today tab.</div>`;
  } else {
    hStats.list.forEach(h=>{
      const count = hStats.counts[h];
      const pct = Math.round((count/hStats.totalDays)*100);
      html += `<div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <span>${h}</span>
          <span style="font-family:'JetBrains Mono',monospace;color:#7A9E85;">${count}/${hStats.totalDays} days (${pct}%)</span>
        </div>
        <div class="bar-bg" style="height:8px;"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,#7A9E85,#7A9E85);"></div></div>
      </div>`;
    });
    html += `<div class="small-note" style="margin-top:4px;">Based on the last 30 days.</div>`;
  }
  html += `</div>`;

  // Strength levels
  html += `<div class="progress-card">
    <div class="progress-label">💪 Strength Levels</div>
    <div class="small-note" style="margin-bottom:12px;">Based on your best logged set (estimated 1RM) vs. your bodyweight, benchmarked against standard strength norms for men.</div>`;
  const bw = getLatestBodyweight();
  Object.keys(LIFT_STANDARDS).forEach(liftName=>{
    const best1RM = bestEstimated1RM(liftName);
    const thresholds = LIFT_STANDARDS[liftName];
    if(best1RM === 0){
      html += `<div class="lift-level-card">
        <div class="lift-level-name">${liftName}</div>
        <div class="small-note">No sets logged yet — log a set to see your level.</div>
      </div>`;
      return;
    }
    const ratio = best1RM / bw;
    const level = strengthLevelFor(ratio, thresholds);
    const next = nextThreshold(ratio, thresholds);
    const nextText = next ? `${Math.round(next.ratio*bw - best1RM)}kg more (est. 1RM) to reach ${next.level}` : "You're at Elite — top-tier relative strength.";
    html += `<div class="lift-level-card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="lift-level-name">${liftName}</div>
        <span class="level-badge level-${level.toLowerCase()}">${level}</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#8B96A3;margin-top:4px;">Est. 1RM: ${best1RM}kg (${ratio.toFixed(2)}× bodyweight)</div>
      <div class="small-note" style="margin-top:4px;">${nextText}</div>
    </div>`;
  });
  html += `</div>`;

  // PR History — all-time best per exercise, one glance
  const prList = prHistoryList();
  html += `<div class="progress-card">
    <div class="progress-label">🏆 PR History</div>`;
  if(prList.length===0){
    html += `<div class="small-note">No PRs yet — log a set on the Today tab to start building this.</div>`;
  } else {
    prList.forEach(pr=>{
      html += `<div class="pr-row"><span>${pr.name}</span><span style="font-family:'JetBrains Mono',monospace;color:#C2703D;">${pr.best}kg <span style="color:#8B96A3;font-size:11px;">(${pr.date})</span></span></div>`;
    });
  }
  html += `</div>`;

  // Achievements
  const achievements = getAchievements();
  const unlockedCount = achievements.filter(a=>a.done).length;
  html += `<div class="progress-card">
    <div class="progress-label">🏅 Achievements (${unlockedCount}/${achievements.length})</div>`;
  achievements.forEach(a=>{
    html += `<div class="achievement-row ${a.done?'unlocked':''}">
      <span class="achievement-icon">${a.done ? a.icon : '🔒'}</span>
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:600;color:${a.done?'#F2EFE9':'#8B96A3'};">${a.name}</div>
        <div class="small-note">${a.desc}</div>
      </div>
    </div>`;
  });
  html += `</div>`;

  // Coach's Corner
  html += `<div class="progress-card">
    <div class="progress-label">🎯 Coach's Corner</div>`;
  const insights = [];
  if(streak >= 3) insights.push(`🔥 ${streak}-day streak — this is exactly when strength adaptation compounds. Don't break it for anything less than real recovery need.`);
  if(streak === 0) insights.push("No active streak right now. One logged session today restarts it — momentum matters more than any single workout.");
  allExerciseNames().slice(0,0); // no-op, keep list logic simple
  ["Back Squat","Deadlift","Barbell Bench Press"].forEach(name=>{
    const hist = getExerciseHistory(name);
    if(hist.length>0){
      const lastDate = hist[hist.length-1].date;
      const daysSince = Math.round((new Date(DATE) - new Date(lastDate)) / 86400000);
      if(daysSince >= 10) insights.push(`⚠️ ${name} hasn't been logged in ${daysSince} days — don't let a key lift quietly disappear from your training.`);
    }
  });
  insights.push("💬 " + coachTipOfDay());
  insights.forEach(t=>{ html += `<div class="coach-tip">${t}</div>`; });
  html += `</div>`;

  return html;
}

function renderProgress(){
  const sortedWeights = [...weightHistory].sort((a,b)=>a.date.localeCompare(b.date));
  let deltaHtml = "";
  if(sortedWeights.length >= 2){
    const first = sortedWeights[0].weight, last = sortedWeights[sortedWeights.length-1].weight;
    const diff = (last - first);
    const sign = diff >= 0 ? "+" : "";
    const color = diff >= 0 ? "#7A9E85" : "#A66B45";
    deltaHtml = `<div style="font-family:'JetBrains Mono',monospace; font-size:13px; color:${color}; margin-top:8px;">
      ${sign}${diff.toFixed(1)}kg since ${first!==undefined ? sortedWeights[0].date : ""} (${first}kg → ${last}kg)
    </div>`;
  }

  let html = `<div class="progress-card">
    <div class="progress-label">😴 Log last night's sleep</div>
    <div class="weight-row">
      <input type="number" placeholder="7.5 (hours)" id="sleepInput" class="weight-input" step="0.5" />
      <button class="weight-save" id="sleepSaveBtn">Save</button>
    </div>
    ${(()=>{
      const sorted = [...sleepHistory].sort((a,b)=>a.date.localeCompare(b.date));
      if(sorted.length===0) return "";
      const last7 = sorted.slice(-7);
      const avg = (last7.reduce((s,x)=>s+x.hours,0)/last7.length).toFixed(1);
      return `<div class="small-note" style="margin-top:8px;">7-day average: <b style="color:#4A8FC2;">${avg}h</b></div>`;
    })()}
  </div>
  <div class="progress-card">
    <div class="progress-label">Sleep trend</div>
    ${svgLineChart([...sleepHistory].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({date:s.date, value:s.hours})), "#4A8FC2", "h")}
  </div>
  <div class="progress-card">
    <div class="progress-label">Log today's weight</div>
    <div class="weight-row">
      <input type="number" placeholder="73.0" id="weightInput" class="weight-input" />
      <button class="weight-save" id="weightSaveBtn">Save</button>
    </div>
    ${deltaHtml}
  </div>
  <div class="progress-card">
    <div class="progress-label">Weight trend</div>
    ${svgLineChart(sortedWeights.map(w=>({date:w.date, value:w.weight})), "#C2703D", "kg")}
  </div>
  <div class="progress-card">
    <div class="progress-label">Weight history</div>`;
  if(weightHistory.length===0){
    html += `<div class="small-note">No entries yet — log your weight weekly (same day, same time, e.g. every Monday morning) to track real trends.</div>`;
  } else {
    [...weightHistory].reverse().forEach(w=>{
      html += `<div class="hist-row"><span class="hist-date">${w.date}</span><span class="hist-val">${w.weight} kg</span></div>`;
    });
  }
  html += `</div>

  <div class="progress-card">
    <div class="progress-label">Log body measurements (cm)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <input type="number" placeholder="Chest" id="mChest" class="weight-input" />
      <input type="number" placeholder="Waist" id="mWaist" class="weight-input" />
      <input type="number" placeholder="Arms" id="mArms" class="weight-input" />
      <input type="number" placeholder="Thighs" id="mThighs" class="weight-input" />
    </div>
    <button class="weight-save" id="measureSaveBtn" style="width:100%;">Save Measurements</button>
  </div>
  <div class="progress-card">
    <div class="progress-label">Chest trend</div>
    ${svgLineChart([...measureHistory].sort((a,b)=>a.date.localeCompare(b.date)).filter(m=>m.chest).map(m=>({date:m.date, value:m.chest})), "#4A8FC2", "cm")}
  </div>
  <div class="progress-card">
    <div class="progress-label">Measurement history</div>`;
  if(measureHistory.length===0){
    html += `<div class="small-note">No measurements logged yet. Chest, waist, arms, and thighs tell you more about actual muscle gain than the scale alone — measure once every 2 weeks, same time of day.</div>`;
  } else {
    [...measureHistory].reverse().forEach(m=>{
      html += `<div class="hist-row"><span class="hist-date">${m.date}</span><span class="hist-val">C${m.chest||"-"} W${m.waist||"-"} A${m.arms||"-"} T${m.thighs||"-"}</span></div>`;
    });
  }
  html += `</div>`;

  const exNames = allExerciseNames();
  if(!selectedStrengthExercise || !exNames.includes(selectedStrengthExercise)) selectedStrengthExercise = exNames[0];
  const exHist = getExerciseHistory(selectedStrengthExercise);
  const best = exHist.length ? Math.max(...exHist.map(h=>h.weight||0)) : 0;
  html += `<div class="progress-card">
    <div class="progress-label">Strength progress</div>
    <select id="strengthExerciseSelect" class="stat-select">
      ${exNames.map(n=>`<option value="${n}" ${n===selectedStrengthExercise?'selected':''}>${n}</option>`).join('')}
    </select>
    <div style="font-family:'JetBrains Mono',monospace;color:#C2703D;font-size:14px;margin-bottom:8px;">Best logged: ${best>0?best+'kg':'—'}</div>
    ${svgLineChart(exHist.map(h=>({date:h.date, value:h.weight})), "#C2703D", "kg")}
  </div>

  <div class="progress-card">
    <div class="progress-label">📸 Progress Photos</div>
    <label class="photo-upload-btn">
      📷 Tap to add today's photo
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" />
    </label>
    <div class="small-note" style="margin-top:8px;">Photos are compressed and saved only on this phone — same as everything else in this app, nothing uploaded anywhere.</div>
    <div class="photo-grid">`;
  [...photoHistory].reverse().forEach((p,revIdx)=>{
    const realIdx = photoHistory.length - 1 - revIdx;
    html += `<div class="photo-thumb-wrap">
      <img src="${p.dataUrl}" class="photo-thumb" />
      <span class="photo-date-tag">${p.date}</span>
      <button class="photo-del-btn" data-del-photo-idx="${realIdx}">✕</button>
    </div>`;
  });
  html += `</div>
  </div>`;

  // All My Data — full summary + export
  const summary = allDataSummary();
  html += `<div class="progress-card">
    <div class="progress-label">📦 All My Data</div>
    <div class="week-summary-grid">
      <div class="week-summary-item"><div class="week-summary-val">${summary.workoutDays}</div><div class="week-summary-label">Workout Days</div></div>
      <div class="week-summary-item"><div class="week-summary-val">${summary.totalSets}</div><div class="week-summary-label">Sets Logged</div></div>
      <div class="week-summary-item"><div class="week-summary-val">${summary.mealsLoggedDays}</div><div class="week-summary-label">Days Meals Logged</div></div>
      <div class="week-summary-item"><div class="week-summary-val">${summary.weightEntries}</div><div class="week-summary-label">Weight Entries</div></div>
      <div class="week-summary-item"><div class="week-summary-val">${summary.sleepEntries}</div><div class="week-summary-label">Sleep Entries</div></div>
      <div class="week-summary-item"><div class="week-summary-val">${summary.measureEntries}</div><div class="week-summary-label">Measurements</div></div>
      <div class="week-summary-item"><div class="week-summary-val">${summary.photoEntries}</div><div class="week-summary-label">Photos</div></div>
      <div class="week-summary-item"><div class="week-summary-val">${summary.injuryEntries}</div><div class="week-summary-label">Injury Notes</div></div>
    </div>
    <button class="weight-save" id="exportDataBtn" style="width:100%;margin-top:14px;">⬇️ Download Full Backup (.json)</button>
    <div class="small-note" style="margin-top:8px;">This saves EVERYTHING — every logged set, meal, weight, sleep entry, photo, and note — as one file to your phone. Worth doing every few weeks, since clearing your browser data or resetting your phone would otherwise erase all of this permanently.</div>
  </div>`;
  return html;
}

let restTimerInterval = null;
let voiceEnabled = false; // voice feature disabled by user request
function speak(text){
  return; // no-op — sound intentionally removed from this app
}
function startRestTimer(seconds){
  const bar = document.getElementById("restTimerBar");
  const text = document.getElementById("restTimerText");
  if(restTimerInterval) clearInterval(restTimerInterval);
  let remaining = seconds;
  bar.style.display = "flex";
  text.textContent = "Rest: " + remaining + "s";
  restTimerInterval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      clearInterval(restTimerInterval);
      restTimerInterval = null;
      bar.style.display = "none";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      return;
    }
    text.textContent = "Rest: " + remaining + "s";
  }, 1000);
}
document.getElementById("restTimerSkip").addEventListener("click", ()=>{
  if(restTimerInterval){ clearInterval(restTimerInterval); restTimerInterval = null; }
  document.getElementById("restTimerBar").style.display = "none";
});

function render(){
  renderTabs();
  document.getElementById("headerSub").textContent =
    `${todaysWorkout.tag} day · ${todaysMeals.style} menu`;
  document.getElementById("verseLine").textContent = verseOfDay();
  const content = document.getElementById("content");
  if(currentTab==="today") content.innerHTML = renderToday();
  else if(currentTab==="insights") content.innerHTML = renderInsights();
  else if(currentTab==="workout") content.innerHTML = renderWorkout();
  else if(currentTab==="meals") content.innerHTML = renderMeals();
  else if(currentTab==="airfryer") content.innerHTML = renderAirFryer();
  else if(currentTab==="grocery") content.innerHTML = renderGrocery();
  else if(currentTab==="recovery") content.innerHTML = renderRecovery();
  else if(currentTab==="progress") content.innerHTML = renderProgress();

  content.querySelectorAll("[data-meal-cb]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const slot = cb.dataset.mealCb;
      log.meals[slot] = !log.meals[slot];
      saveLog(log);
      render();
    });
  });
  content.querySelectorAll("[data-ex-cb]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.exCb;
      log.workout[name] = !log.workout[name];
      saveLog(log);
      render();
    });
  });
  content.querySelectorAll("[data-week]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      log.week = parseInt(btn.dataset.week,10);
      saveLog(log);
      render();
    });
  });
  const saveBtn = document.getElementById("weightSaveBtn");
  if(saveBtn){
    saveBtn.addEventListener("click", ()=>{
      const val = parseFloat(document.getElementById("weightInput").value);
      if(!val) return;
      weightHistory = [...weightHistory.filter(w=>w.date!==DATE), {date:DATE, weight:val}]
        .sort((a,b)=>a.date.localeCompare(b.date));
      saveWeightHistory(weightHistory);
      render();
    });
  }
  const sleepBtn = document.getElementById("sleepSaveBtn");
  if(sleepBtn){
    sleepBtn.addEventListener("click", ()=>{
      const val = parseFloat(document.getElementById("sleepInput").value);
      if(!val) return;
      sleepHistory = [...sleepHistory.filter(s=>s.date!==DATE), {date:DATE, hours:val}]
        .sort((a,b)=>a.date.localeCompare(b.date));
      saveSleepHistory(sleepHistory);
      render();
    });
  }
  const measureBtn = document.getElementById("measureSaveBtn");
  if(measureBtn){
    measureBtn.addEventListener("click", ()=>{
      const chest = parseFloat(document.getElementById("mChest").value) || null;
      const waist = parseFloat(document.getElementById("mWaist").value) || null;
      const arms = parseFloat(document.getElementById("mArms").value) || null;
      const thighs = parseFloat(document.getElementById("mThighs").value) || null;
      if(!chest && !waist && !arms && !thighs) return;
      measureHistory = [...measureHistory.filter(m=>m.date!==DATE), {date:DATE, chest, waist, arms, thighs}]
        .sort((a,b)=>a.date.localeCompare(b.date));
      saveMeasureHistory(measureHistory);
      render();
    });
  }
  content.querySelectorAll("[data-ex-save]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const name = btn.dataset.exSave;
      const slug = btn.dataset.exSlug;
      const weightVal = parseFloat(document.getElementById("w-"+slug).value) || null;
      const repsVal = parseInt(document.getElementById("r-"+slug).value) || null;
      if(!weightVal || !repsVal){
        btn.textContent = "Enter both!";
        setTimeout(()=>{ btn.textContent = "+ Log Set"; }, 1400);
        return;
      }
      const wasPR = isPR(name, weightVal);
      exLog[name] = exLog[name] || { sets: [] };
      if(!exLog[name].sets) exLog[name].sets = [];
      exLog[name].sets.push({ weight: weightVal, reps: repsVal });
      saveExLog(DATE, exLog);
      log.workout[name] = true; // auto-mark done once at least one real set is logged
      saveLog(log);
      if(wasPR){
        celebrate("🏆 New PR! " + weightVal + "kg — " + name);
      }
      startRestTimer(90);
      render();
    });
  });
  content.querySelectorAll("[data-del-set]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const name = btn.dataset.delSet;
      const idx = parseInt(btn.dataset.delIdx, 10);
      if(exLog[name] && exLog[name].sets){
        exLog[name].sets.splice(idx, 1);
        saveExLog(DATE, exLog);
        render();
      }
    });
  });
  const strengthSelect = document.getElementById("strengthExerciseSelect");
  if(strengthSelect){
    strengthSelect.addEventListener("change", ()=>{
      selectedStrengthExercise = strengthSelect.value;
      render();
    });
  }
  const photoInput = document.getElementById("photoInput");
  if(photoInput){
    photoInput.addEventListener("change", (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (ev)=>{
        img.onload = ()=>{
          const maxW = 700;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width*scale;
          canvas.height = img.height*scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
          photoHistory = [...photoHistory.filter(p=>p.date!==DATE), {date:DATE, dataUrl}];
          if(savePhotoHistory(photoHistory)) render();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  content.querySelectorAll("[data-del-photo-idx]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.delPhotoIdx, 10);
      photoHistory.splice(idx, 1);
      savePhotoHistory(photoHistory);
      render();
    });
  });
  const injurySaveBtn = document.getElementById("injurySaveBtn");
  if(injurySaveBtn){
    injurySaveBtn.addEventListener("click", ()=>{
      const exercise = document.getElementById("injuryExerciseSelect").value;
      const note = document.getElementById("injuryNoteInput").value.trim();
      if(!note) return;
      injuryLog.push({date:DATE, exercise, note});
      saveInjuryLog(injuryLog);
      render();
    });
  }
  content.querySelectorAll("[data-del-injury-idx]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.delInjuryIdx, 10);
      injuryLog.splice(idx, 1);
      saveInjuryLog(injuryLog);
      render();
    });
  });
  const exportBtn = document.getElementById("exportDataBtn");
  if(exportBtn){
    exportBtn.addEventListener("click", exportAllData);
  }
  content.querySelectorAll("[data-af-filter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ afFilter = btn.dataset.afFilter; render(); });
  });
  content.querySelectorAll("[data-habit-cb]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const h = cb.dataset.habitCb;
      log.habits[h] = !log.habits[h];
      saveLog(log);
      render();
    });
  });
  content.querySelectorAll("[data-del-habit-idx]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.delHabitIdx, 10);
      const list = loadHabitList();
      list.splice(idx, 1);
      saveHabitList(list);
      render();
    });
  });
  const addHabitBtn = document.getElementById("addHabitBtn");
  if(addHabitBtn){
    addHabitBtn.addEventListener("click", ()=>{
      const input = document.getElementById("newHabitInput");
      const val = input.value.trim();
      if(!val) return;
      const list = loadHabitList();
      list.push(val);
      saveHabitList(list);
      render();
    });
  }
  content.querySelectorAll("[data-supp-cb]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const s = cb.dataset.suppCb;
      log.supplements[s] = !log.supplements[s];
      saveLog(log);
      render();
    });
  });
  content.querySelectorAll("[data-del-supp-idx]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.delSuppIdx, 10);
      const list = loadSupplementList();
      list.splice(idx, 1);
      saveSupplementList(list);
      render();
    });
  });
  const addSuppBtn = document.getElementById("addSuppBtn");
  if(addSuppBtn){
    addSuppBtn.addEventListener("click", ()=>{
      const input = document.getElementById("newSuppInput");
      const val = input.value.trim();
      if(!val) return;
      const list = loadSupplementList();
      list.push(val);
      saveSupplementList(list);
      render();
    });
  }
  postRender();
}

render();

/* ---------------- PWA install + service worker ---------------- */
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").style.display = "block";
});
document.getElementById("installBtn").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBanner").style.display = "none";
});
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
