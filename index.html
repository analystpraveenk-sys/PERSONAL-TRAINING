function loadExLog(date){
  try { const raw = localStorage.getItem("exlog:"+date); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveExLog(date, data){ localStorage.setItem("exlog:"+date, JSON.stringify(data)); }
function getExerciseHistory(exerciseName){
  const out = [];
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.startsWith("exlog:")){
      const date = key.slice(6);
      try {
        const data = JSON.parse(localStorage.getItem(key));
        if(data[exerciseName] && data[exerciseName].weight){
          out.push({ date, weight: data[exerciseName].weight, reps: data[exerciseName].reps, sets: data[exerciseName].sets });
        }
      } catch(e){}
    }
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function getLatestBodyweight(){
  if(weightHistory.length===0) return 73;
  return [...weightHistory].sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0].weight;
}
function parseSets(str){
  const m = (str||"").match(/^(\d+)x/);
  return m ? parseInt(m[1],10) : 3;
}
function sessionStats(){
  let totalSets = 0, tonnage = 0;
  const weekKey = "w"+log.week;
  todaysWorkout.exercises.forEach(ex=>{
    if(log.workout[ex.name]){
      const sets = parseSets(ex[weekKey]);
      totalSets += sets;
      const detail = exLog[ex.name];
      if(detail && detail.weight && detail.reps){
        tonnage += detail.weight * detail.reps * sets;
      }
    }
  });
  const bw = getLatestBodyweight();
  const minutes = totalSets * 3; // ~3 min per set incl. rest, rough estimate
  const MET = 6.0; // vigorous resistance training
  const calories = Math.round(MET * 3.5 * bw / 200 * minutes);
  return { totalSets, tonnage: Math.round(tonnage), calories };
}
function isPR(exerciseName, weight){
  if(!weight) return false;
  const hist = getExerciseHistory(exerciseName).filter(h=>h.date!==DATE);
  if(hist.length===0) return false;
  const maxWeight = Math.max(...hist.map(h=>h.weight||0));
  return weight > maxWeight;
}
function getWorkoutStreak(){
  let streak = 0;
  let d = new Date();
  for(let i=0;i<90;i++){
    const iso = d.toISOString().slice(0,10);
    const dow = d.getDay();
    if(dow===0){ d.setDate(d.getDate()-1); continue; } // Sunday rest day doesn't break streak
    try {
      const raw = localStorage.getItem("log:"+iso);
      if(raw){
        const data = JSON.parse(raw);
        const hasWorkout = data.workout && Object.values(data.workout).some(v=>v);
        if(hasWorkout){ streak++; d.setDate(d.getDate()-1); continue; }
      }
    } catch(e){}
    break;
  }
  return streak;
}

function slugify(s){ return s.replace(/[^a-zA-Z0-9]/g,""); }

function toggleVideo(uid, name, isMeal){
  const box = document.getElementById("vidbox-"+uid);
  if(!box) return;
  if(box.style.display === "block"){
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }
  const map = isMeal ? RECIPE_VIDEO_IDS : VIDEO_IDS;
  const id = map[name];
  if(id){
    box.innerHTML = `<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${name}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  } else {
    window.open(ytLink(name + (isMeal ? " recipe" : " proper form tutorial")), "_blank");
    return;
  }
  box.style.display = "block";
}

function ring(label, value, target, color, unit){
  const pct = target ? Math.min(Math.round((value/target)*100),100) : 0;
  return `<div class="ring-wrap">
    <div class="ring" style="background:conic-gradient(${color} ${pct*3.6}deg, #2A322F ${pct*3.6}deg)">
      <div class="ring-inner">
        <span class="ring-val">${value}</span>
        <span class="ring-target">/${target}${unit}</span>
      </div>
    </div>
    <span class="ring-label">${label}</span>
  </div>`;
}

function svgLineChart(points, color, unit){
  if(points.length < 2){
    return `<div class="small-note">Log at least 2 entries to see a trend chart.</div>`;
  }
  const w = 320, h = 140, pad = 28;
  const vals = points.map(p=>p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min===max){ min -= 1; max += 1; }
  const xStep = (w - pad*2) / (points.length - 1);
  const coords = points.map((p,i)=>{
    const x = pad + i*xStep;
    const y = h - pad - ((p.value - min)/(max-min)) * (h - pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?"M":"L") + c[0].toFixed(1) + "," + c[1].toFixed(1)).join(" ");
  const dots = coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="${color}"><title>${points[i].date}: ${points[i].value}${unit}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <text x="${pad}" y="14" font-size="10" fill="#8A9490" font-family="JetBrains Mono, monospace">${max}${unit}</text>
    <text x="${pad}" y="${h-pad+16}" font-size="10" fill="#8A9490" font-family="JetBrains Mono, monospace">${min}${unit}</text>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}
  </svg>`;
}

  }
  html += `</div>`;

  const exNames = allExerciseNames();
  if(!selectedStrengthExercise || !exNames.includes(selectedStrengthExercise)) selectedStrengthExercise = exNames[0];
  const exHist = getExerciseHistory(selectedStrengthExercise);
  const best = exHist.length ? Math.max(...exHist.map(h=>h.weight||0)) : 0;
  html += `<div class="progress-card">
    <div class="progress-label">Strength progress</div>
    <select id="strengthExerciseSelect" class="stat-select">
      ${exNames.map(n=>`<option value="${n}" ${n===selectedStrengthExercise?'selected':''}>${n}</option>`).join('')}
    </select>
    <div style="font-family:'JetBrains Mono',monospace;color:#E8A33D;font-size:14px;margin-bottom:8px;">Best logged: ${best>0?best+'kg':'—'}</div>
    ${svgLineChart(exHist.map(h=>({date:h.date, value:h.weight})), "#E8A33D", "kg")}
  </div>`;
  return html;
}

function render(){
  renderTabs();
  document.getElementById("headerSub").textContent =
    `Target: Dec 25, 2026 · ${todaysWorkout.tag} day · ${todaysMeals.style} menu`;
  const content = document.getElementById("content");
  if(currentTab==="today") content.innerHTML = renderToday();
  else if(currentTab==="workout") content.innerHTML = renderWorkout();
  else if(currentTab==="meals") content.innerHTML = renderMeals();
  else if(currentTab==="grocery") content.innerHTML = renderGrocery();
  else if(currentTab==="supplements") content.innerHTML = renderSupplements();
  else if(currentTab==="progress") content.innerHTML = renderProgress();

  content.querySelectorAll("[data-meal-cb]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const slot = cb.dataset.mealCb;
      log.meals[slot] = !log.meals[slot];
      saveLog(log);
      render();
    });
  });
  content.querySelectorAll("[data-ex-cb]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const name = cb.dataset.exCb;
      log.workout[name] = !log.workout[name];
      saveLog(log);
      render();
    });
  });
  content.querySelectorAll("[data-week]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      log.week = parseInt(btn.dataset.week,10);
      saveLog(log);
      render();
    });
  });
  const saveBtn = document.getElementById("weightSaveBtn");
  if(saveBtn){
    saveBtn.addEventListener("click", ()=>{
      const val = parseFloat(document.getElementById("weightInput").value);
      if(!val) return;
      weightHistory = [...weightHistory.filter(w=>w.date!==DATE), {date:DATE, weight:val}]
        .sort((a,b)=>a.date.localeCompare(b.date));
      saveWeightHistory(weightHistory);
      render();
    });
  }
  const measureBtn = document.getElementById("measureSaveBtn");
  if(measureBtn){
    measureBtn.addEventListener("click", ()=>{
      const chest = parseFloat(document.getElementById("mChest").value) || null;
      const waist = parseFloat(document.getElementById("mWaist").value) || null;
      const arms = parseFloat(document.getElementById("mArms").value) || null;
      const thighs = parseFloat(document.getElementById("mThighs").value) || null;
      if(!chest && !waist && !arms && !thighs) return;
      measureHistory = [...measureHistory.filter(m=>m.date!==DATE), {date:DATE, chest, waist, arms, thighs}]
        .sort((a,b)=>a.date.localeCompare(b.date));
      saveMeasureHistory(measureHistory);
      render();
    });
  }
  content.querySelectorAll("[data-ex-weight]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const name = inp.dataset.exWeight;
      const val = parseFloat(inp.value) || null;
      exLog[name] = exLog[name] || {};
      exLog[name].weight = val;
      const weekKey = "w"+log.week;
      const exObj = todaysWorkout.exercises.find(e=>e.name===name);
      exLog[name].sets = exObj ? parseSets(exObj[weekKey]) : null;
      saveExLog(DATE, exLog);
      render();
    });
  });
  content.querySelectorAll("[data-ex-reps]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const name = inp.dataset.exReps;
      const val = parseInt(inp.value) || null;
      exLog[name] = exLog[name] || {};
      exLog[name].reps = val;
      saveExLog(DATE, exLog);
      render();
    });
  });
  const strengthSelect = document.getElementById("strengthExerciseSelect");
  if(strengthSelect){
    strengthSelect.addEventListener("change", ()=>{
      selectedStrengthExercise = strengthSelect.value;
      render();
    });
  }
}

render();

/* ---------------- PWA install + service worker ---------------- */
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").style.display = "block";
});
document.getElementById("installBtn").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBanner").style.display = "none";
});
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
</body>
</html>
